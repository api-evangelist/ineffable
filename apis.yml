aid: ineffable
name: Ineffable
description: >-
  Ineffable Intelligence is an AI research lab founded by David Silver aiming to make "first contact
  with superintelligence." The company is building a "superlearner" that discovers knowledge from its
  own experience using reinforcement learning, without relying on human data, with the goal of
  rediscovering and transcending human inventions such as language, science, mathematics and technology.
  Backed by Bond Capital and Index Ventures, Ineffable is an early-stage research lab: at this time it
  publishes a mission/beliefs site, a founder blog note, and open roles, but no public API, developer
  portal, SDKs, or machine-readable specifications. This profile captures the company's public identity
  and domain-security posture for the API Evangelist network.
